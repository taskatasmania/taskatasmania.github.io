<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Taska Tasmania</title>
    <link rel="icon" type="image/png" href="graphics/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        body {
            font-family: 'Georgia', serif;
        }
        /* Custom CSS to hide scrollbar (carried over from index.html) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none; 
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .visual-hidden {
           display: none !important;
        }
    </style>
</head>

<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div class="w-full max-w-6xl p-6 md:p-10 text-lg">

        <header class="mb-6 pb-4 flex justify-center">
            <a>
                <img 
                    src="graphics/logo.colour.main.png"
                    alt="Market Information Logo" 
                    class="max-w-xs w-auto h-auto rounded-lg lg:max-w-[44rem]"
                    onerror="this.onerror=null; this.src='https://placehold.co/192x64/cccccc/333333?text=Fallback+Logo';"
                />
            </a>
        </header>

        <!--<hr class="my-8 border-lime-200">-->
        
        <div class="md:max-w-xl mx-auto">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-lime-700 tracking-tight mb-4 text-center">Get in Touch</h1>
        
            <p class="mb-6 text-lg text-lime-800 leading-relaxed text-center">
                We're happy to answer any questions about our products, markets, or custom orders.
            </p>
        </div>


        <div class="max-w-md mx-auto">
            
            <div class="flex justify-between items-center py-4 px-1"> 
                <a href="https://www.facebook.com/taskatasmania/" target="_blank" rel="noopener noreferrer" class="flex items-center">
                    <img 
                        src="graphics/facebook.jpg" 
                        alt="Facebook Link" 
                        class="h-12 w-auto transition-opacity hover:opacity-75"
                        onerror="this.onerror=null; this.src='https://placehold.co/32x32/3b5998/ffffff?text=F';"
                    />
                </a>
                
                <h2 class="text-4xl text-lime-700 tracking-tight mb-0 text-center">
                    Contact
                </h2>
                
                <a href="https://www.instagram.com/taskatasmania" target="_blank" rel="noopener noreferrer" class="flex items-center">
                    <img 
                        src="graphics/instagram.jpg" 
                        alt="Instagram Link" 
                        class="h-12 w-auto transition-opacity hover:opacity-75"
                        onerror="this.onerror=null; this.src='https://placehold.co/32x32/c32aa3/ffffff?text=I';"
                    />
                </a>

            </div>
            
        </div>
        <span class="block mt-3">

<!-----------------------------------------Form----------------------------------------------------------------------->


<form action="https://api.web3forms.com/submit" method="POST" class="max-w-2xl mx-auto p-4">
    
    <input type="hidden" name="access_key" value="a0b5443b-c98a-4c42-a2be-a5e873466c94">
    
    <input type="hidden" name="redirect" value="https://taskatasmania.github.io/thank-you.html">

    <input type="hidden" name="subject" value="New Contact Form Submission from Taska Tasmania">

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-lime-800 mb-1">Your Name</label>
        <input type="text" id="name" name="Name" required class="w-full px-3 py-2 border border-lime-300 rounded-md focus:outline-none focus:ring-2 focus:ring-lime-500">
    </div>

    <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-lime-800 mb-1">Your Email</label>
        <input type="email" id="email" name="Email" required class="w-full px-3 py-2 border border-lime-300 rounded-md focus:outline-none focus:ring-2 focus:ring-lime-500">
    </div>

    <div class="mb-8">
        <label for="message" class="block text-sm font-medium text-lime-800 mb-1">Message</label>
        <textarea id="message" name="Message" rows="7" required class="w-full px-3 py-2 border border-lime-300 rounded-md focus:outline-none focus:ring-2 focus:ring-lime-500"></textarea>
    </div>

    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

    <button type="submit" class="w-full bg-lime-700 text-lime-100 font-bold py-2 px-4 rounded-md hover:bg-lime-600 transition duration-200">
        Send Message
    </button>
    
</form>

</a>
<span class="text-lime-700">-</span>

<a href="story.html" class="text-lime-700 hover:text-amber-500 font-bold transition duration-150">

</a>
</div>

</footer>

    </div> 

</body>
</html>
