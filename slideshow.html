<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Slideshow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the slideshow component */
        .slideshow-container {
            position: relative;
            max-width: 400px; /* Constrain the slideshow width */
            margin: auto;
        }

        /* Styles for the dynamic image element */
        .slideshow-img {
            display: none; 
            width: 100%;
            height: 100%;
            touch-action: manipulation; 
            -webkit-touch-callout: none; 
            user-select: none;
        }

        /* Navigation Arrows (Prev/Next) */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 10px; 					
            margin-top: -16px; 					
            color: #FCD34D; 					
            font-weight: bold;
            font-size: 12px; 					
            transition: 0.6s ease;
            user-select: none;
            background-color: #D97706; 	
            border-radius: 0.5rem; 
        }

        .next {
            right: 0;
            border-radius: 0.5rem;
        }

        .prev:hover, .next:hover {
            background-color: #B45309; 
        }

        /* General Body Styling (Keep body simple for iframe) */
        body {
            font-family: 'Georgia', serif;
            /* CRITICAL FIX: Remove default browser margins and padding */
            margin: 0;
            padding: 0;
            /* Removed overflow: hidden; */
        }
        
        /* Styles for the dots */
        .dot {
            cursor: pointer;
            height: 7px;
            width: 7px;
            margin: 0 4px;
            background-color: #FBBC05; 	
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active-dot, .dot:hover {
            background-color: #581C87;
        }
    </style>
</head>

<body> 
    <main class="pb-8"> 
        <div class="slideshow-container mt-0 mb-0">
            
            <div class="text-xl font-semibold text-lime-700 text-center mt-3 mb-3">
                From shopping bags to .... 
            </div>

            <div class="aspect-square w-full rounded-lg shadow-xl overflow-hidden">
                <div id="slideshow-image" class="h-full w-full flex items-center justify-center">
                </div>
            </div>
            
            <div id="slideshow-caption" class="mt-3 py-1 px-2 mb-0 w-full text-center">
            </div>
            
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>

        <div id="dot-container" class="flex justify-center py-2">
        </div>
    </main>
    
    <script>
    // SLIDESHOW SCRIPTING START
    let slideIndex = 0;
    let slideshowInterval;
    let isPaused = false; 
    
    // Data array with your product image paths

    const slides = [
        { path: 'products/bows.jpg', caption: 'Bows' }, 
        { path: 'products/lanyards.jpg', caption: 'Lanyards' },
        { path: 'products/boxies.jpg', caption: 'Boxies' },
        { path: 'products/purses.jpg', caption: 'Purses' },
        { path: 'products/tote_bags.jpg', caption: 'Designer Totes' },
        { path: 'products/scrunchies.jpg', caption: 'Scrunchies' },
        { path: 'products/scrunchies2.jpg', caption: 'Scrunchies' },
         { path: 'products/teas.jpg', caption: 'Tea Towels' },    
        { path: 'products/headbands.jpg', caption: 'Headbands' },
        { path: 'products/makeup.jpg', caption: 'Makeup Wipes' },
        { path: 'products/bows2.jpg', caption: 'Bows' }
    ];

    // FUNCTION FOR IFRAME COMMUNICATION
    function sendHeightToParent() {
        // Get the total height required by the <body> content
        const contentHeight = document.body.scrollHeight;
        
        if (window.parent) {
            window.parent.postMessage({
                iframeHeight: contentHeight
            }, '*'); 
        }
    }
    
    // Function to set up touch events directly on the image element
    function setupTouchEvents(imgElement) {
        if (imgElement) {
            imgElement.addEventListener('touchstart', pauseSlideshow);
            imgElement.addEventListener('touchend', resumeSlideshow);
        }
    }

    function showSlides(n) {
        if (slides.length === 0) return;

        // 1. Calculate the new slide index (wraps around)
        if (n !== 0) {
            slideIndex += n;
        }
        
        if (slideIndex > slides.length - 1) { slideIndex = 0 }
        if (slideIndex < 0) { slideIndex = slides.length - 1 }

        const currentSlide = slides[slideIndex];
        const slideshowImage = document.getElementById('slideshow-image'); 
        const slideshowCaption = document.getElementById('slideshow-caption'); 
        const dots = document.getElementsByClassName("dot"); 

        // 2a. Inject the new IMAGE HTML 
        slideshowImage.innerHTML = `
            <img
                src="${currentSlide.path}"
                alt="${currentSlide.caption}"
                class="slideshow-img h-full w-full object-contain transition-opacity duration-1000"
                style="display: block; opacity: 0;"
                onerror="this.onerror=null; this.src='https://placehold.co/400x400/cccccc/333333?text=Image+Error';"
                oncontextmenu="return false;" /* Blocks long-press download prompt */
            />
        `;

        // 2b. Inject the new CAPTION HTML
        slideshowCaption.innerHTML = `
            <p class="text-xl font-semibold text-lime-700">
                ${currentSlide.caption}
            </p>
        `;

        // 3. Highlight the correct dot
        for (let i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active-dot", "");
        }
        if (dots.length > 0) {
            dots[slideIndex].className += " active-dot";
        }

        // 4. Trigger the fade-in and setup touch listeners
        setTimeout(() => {
            const imgElement = slideshowImage.querySelector('img');
            if(imgElement) {
                imgElement.style.opacity = 1;
                setupTouchEvents(imgElement); /* Attaches touch events directly to the image */
            }
        }, 10);

        // 5. Logic to reset the timer
        if (n !== 0 && !isPaused) {
            clearInterval(slideshowInterval);
            autoShowSlides(); 
        }
        
        // 6. Send height after slide content is updated
        sendHeightToParent();
    }

    // Function to navigate directly to a slide index
    function currentSlide(n) {
        slideIndex = n; 
        showSlides(0);
    }
    
    // Function to create and draw the dots on load
    function drawDots() {
        const dotContainer = document.getElementById('dot-container');
        if (!dotContainer) return;

        let dotHTML = '';
        for (let i = 0; i < slides.length; i++) {
            dotHTML += `<span class="dot" onclick="currentSlide(${i})"></span>`;
        }
        dotContainer.innerHTML = dotHTML;
    }

    function autoShowSlides() {
        if (!isPaused) {
            // Cycles every 8000 milliseconds (8 seconds)
            slideshowInterval = setInterval(() => {
                showSlides(1); 
            }, 8000); 
        }
    }
    
    function pauseSlideshow() {
        clearInterval(slideshowInterval);
        isPaused = true;
    }

    function resumeSlideshow() {
        if (isPaused) {
            isPaused = false;
            autoShowSlides();
        }
    }

    function plusSlides(n) {
        showSlides(n);
    }

    // Initialize slideshow and setup event listeners for hover and resize
    window.addEventListener('load', () => {
        // Initial calls
        drawDots(); 
        slideIndex = 0;
        showSlides(0); 
        autoShowSlides(); 
        sendHeightToParent(); // Initial send

        const container = document.querySelector('.slideshow-container');
        
        if (container) {
            // MOUSE EVENTS 
            container.addEventListener('mouseenter', pauseSlideshow);
            container.addEventListener('mouseleave', resumeSlideshow);
        }
        
        // *** FIX FOR ROTATION: Listen for window resize/rotation events and re-send height ***
        window.addEventListener('resize', () => {
            // Use a small delay (debounce) to ensure elements have settled before calculation.
            setTimeout(sendHeightToParent, 100); 
        });
        // *** END FIX ***
    });
    // SLIDESHOW SCRIPTING END
</script>
</body>
</html>
