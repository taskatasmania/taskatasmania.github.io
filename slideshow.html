<!-- 1. Structural Layer: HTML (<!DOCTYPE html> to </html>) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Slideshow Only</title>
    <!-- Load Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the slideshow component */
        .slideshow-container {
            position: relative;
            max-width: 400px; /* Constrain the slideshow width */
            margin: auto;
            /* Added padding-top to prevent margin collapse with body/outer container */
            padding-top: 1px;
        }



        /* Styles are mostly handled by the dynamic injection in JS now, but keeping definitions */
        .slideshow-img {
        display: none; 
        width: 100%;
        height: 100%;
        /* NEW: Add touch-action for better mobile gesture handling */
        touch-action: manipulation; 
    }


        /* Navigation Arrows (Prev/Next) */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px; /* Pulls element up by half its height for vertical centering */
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            user-select: none;
            background-color: rgba(0,0,0,0.5);
            /* Add some Tailwind-like rounded corners to look consistent */
            border-radius: 0.5rem; 
        }
        
        .next {
            right: 0;
            border-radius: 0.5rem;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        body {
    font-family: 'Georgia', serif;
    background-color: #f3f4f6; /* bg-neutral-100 */
    min-height: 100vh;
    /* REMOVE: display: flex; */
    /* REMOVE: align-items: center; */
    /* REMOVE: justify-content: center; */
}
/* New styles for the dots */
.dot {
        cursor: pointer;
        height: 12px;
        width: 12px;
        margin: 0 4px;
        background-color: #bbb; /* A light grey color */
        border-radius: 50%;
        display: inline-block;
        transition: background-color 0.6s ease;
    }

    .active-dot, .dot:hover {
        background-color: #65a30d; /* A lime green color */
    }
</style>
</head>

<body class="p-4 sm:p-6 md:p-10"> 
    <div class="w-full max-w-lg bg-white shadow-xl rounded-xl border border-gray-100 mx-auto p-6 md:p-10">
        
        <div class="slideshow-container mt-6 mb-0">
            
            <div class="aspect-square w-full rounded-lg shadow-xl overflow-hidden">
                <div id="slideshow-image" class="h-full w-full flex items-center justify-center">
                </div>
            </div>
            
            <div id="slideshow-caption" class="mt-2 py-1 px-2 mb-0 w-full text-center">
            </div>
            
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>

        <div id="dot-container" class="flex justify-center p-4">
        </div>
    </div> </body>
        <!-- END SLIDESHOW HTML STRUCTURE -->
    </div>

    <script>
        // SLIDESHOW SCRIPTING START
        let slideIndex = 0;
        let slideshowInterval;
        let isPaused = false; 
        
        // Data array with placeholder image URLs (Insert your actual paths here!)
        const slides = [
            { path: 'https://placehold.co/400x400/77DD77/FFFFFF?text=Bows', caption: 'Bows' },
            { path: 'https://placehold.co/400x400/ADD8E6/333333?text=Boxies', caption: 'Boxies' },
            { path: 'https://placehold.co/400x400/FFB6C1/333333?text=Card+Holders', caption: 'Card Holders' },
            { path: 'https://placehold.co/400x400/FFA07A/333333?text=Headbands', caption: 'Headbands' },
            { path: 'https://placehold.co/400x400/87CEFA/333333?text=Lanyards', caption: 'Lanyards' },
            { path: 'https://placehold.co/400x400/DA70D6/FFFFFF?text=Makeup+Bags', caption: 'Makeup Wipes' },
            { path: 'https://placehold.co/400x400/F0E68C/333333?text=Scrunchies', caption: 'Scrunchies' },
            { path: 'https://placehold.co/400x400/F4A460/333333?text=Tea+Towels', caption: 'Tea Towels' },
            { path: 'https://placehold.co/400x400/4682B4/FFFFFF?text=Tote+Bags', caption: 'Tote Bags' }
        ];
    
        function showSlides(n) {
            if (slides.length === 0) return;
    
            // 1. Calculate the new slide index (wraps around)
            if (n !== 0) {
                slideIndex += n;
            }
            
            if (slideIndex > slides.length - 1) { slideIndex = 0 }
            if (slideIndex < 0) { slideIndex = slides.length - 1 }
    
            const currentSlide = slides[slideIndex];
            const slideshowImage = document.getElementById('slideshow-image'); 
            const slideshowCaption = document.getElementById('slideshow-caption'); 
            const dots = document.getElementsByClassName("dot"); 
    
            // 2a. Inject the new IMAGE HTML 
            slideshowImage.innerHTML = `
            <img
            src="${currentSlide.path}"
            alt="${currentSlide.caption}"
            class="slideshow-img h-full w-full object-contain transition-opacity duration-1000"
            style="display: block; opacity: 0;"
            onerror="this.onerror=null; this.src='https://placehold.co/400x400/cccccc/333333?text=Image+Error';"
        
            /* NEW: Block the right-click/long-press menu */
            oncontextmenu="return false;"
            />
        `;
    
            // 2b. Inject the new CAPTION HTML 
            slideshowCaption.innerHTML = `
                <p class="text-xl font-semibold text-lime-700">
                    ${currentSlide.caption}
                </p>
            `;
    
            // 3. Highlight the correct dot
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active-dot", "");
            }
            if (dots.length > 0) {
                dots[slideIndex].className += " active-dot";
            }
    
            // 4. Trigger the fade-in 
            setTimeout(() => {
                const imgElement = slideshowImage.querySelector('img');
                if(imgElement) {
                    imgElement.style.opacity = 1;
                }
            }, 10);
    
            // 5. Logic to reset the timer 
            if (n !== 0 && !isPaused) {
                clearInterval(slideshowInterval);
                autoShowSlides(); 
            }
        }
        
        // CORRECTED: Function to navigate directly to a slide index
        function currentSlide(n) {
          slideIndex = n; 
          showSlides(0); // Display the index without advancing
        }
        
        // NEW: Function to create and draw the dots on load
        function drawDots() {
            const dotContainer = document.getElementById('dot-container');
            if (!dotContainer) return;
    
            let dotHTML = '';
            for (let i = 0; i < slides.length; i++) {
                // Passes the zero-based index (i)
                dotHTML += `<span class="dot" onclick="currentSlide(${i})"></span>`;
            }
            dotContainer.innerHTML = dotHTML;
        }
    
        function autoShowSlides() {
            if (!isPaused) {
                // Cycles every 8000 milliseconds (8 seconds)
                slideshowInterval = setInterval(() => {
                    showSlides(1); 
                }, 8000); 
            }
        }
        
        function pauseSlideshow() {
            clearInterval(slideshowInterval);
            isPaused = true;
        }
    
        function resumeSlideshow() {
            if (isPaused) {
                isPaused = false;
                autoShowSlides();
            }
        }
    
        function plusSlides(n) {
            showSlides(n);
        }
    
        // Initialize slideshow and setup event listeners for hover and touch
        window.addEventListener('load', () => {
            drawDots(); 
            
            slideIndex = 0;
            showSlides(0); 
            autoShowSlides(); 
    
            const container = document.querySelector('.slideshow-container');
            
            if (container) {
                // MOUSE EVENTS (for desktop/mouse users)
                container.addEventListener('mouseenter', pauseSlideshow);
                container.addEventListener('mouseleave', resumeSlideshow);
                
                // TOUCH EVENTS (for smartphone/tablet users)
                container.addEventListener('touchstart', pauseSlideshow);
                container.addEventListener('touchend', resumeSlideshow);
            }
        });
        // SLIDESHOW SCRIPTING END
    </script>
</body>
</html>
